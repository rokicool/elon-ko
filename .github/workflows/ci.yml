# Pure content library: no build, no toolchain, no plugin install.
# This check validates frontmatter sanity of the kept content only.
# Deliberately NO skills↔agents 1:1 mapping assertion (elon + logging-design are
# skills without agent defs), NO node/bun toolchain, NO plugin install.
name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content-sanity:
    name: Content sanity (frontmatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent definitions frontmatter (.omp/agents)
        run: |
          set -euo pipefail
          fail=0
          for f in .omp/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing opening '---' fence"; fail=1; continue; }
            fm="$(sed -n '2,/^---$/p' "$f")"
            for key in name description tools; do
              printf '%s\n' "$fm" | grep -qE "^${key}:" || { echo "::error file=$f::missing frontmatter key '${key}:'"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] && echo "OK: all .omp/agents/*.md carry name/description/tools"
      - name: Skills frontmatter (.agents/skills)
        run: |
          set -euo pipefail
          fail=0
          for d in .agents/skills/*/; do
            f="${d}SKILL.md"
            [ -f "$f" ] || { echo "::error file=$d::missing SKILL.md"; fail=1; continue; }
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing opening '---' fence"; fail=1; continue; }
            fm="$(sed -n '2,/^---$/p' "$f")"
            for key in name description; do
              printf '%s\n' "$fm" | grep -qE "^${key}:" || { echo "::error file=$f::missing frontmatter key '${key}:'"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] && echo "OK: all .agents/skills/*/SKILL.md carry name/description"
