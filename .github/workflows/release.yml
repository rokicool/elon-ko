# Notes-only release: source of truth is the git tag + CHANGELOG; NO artifacts
# (no .tgz/.tar.gz/SHA256SUMS) by design.
# The sanity steps exist so a tag can never publish from a broken content tree (approved spec flag F4).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    name: Sanity-check content & publish release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent definitions frontmatter (.omp/agents)
        run: |
          set -euo pipefail
          fail=0
          for f in .omp/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing opening '---' fence"; fail=1; continue; }
            fm="$(sed -n '2,/^---$/p' "$f")"
            for key in name description tools; do
              printf '%s\n' "$fm" | grep -qE "^${key}:" || { echo "::error file=$f::missing frontmatter key '${key}:'"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] && echo "OK: all .omp/agents/*.md carry name/description/tools"
      - name: Skills frontmatter (.agents/skills)
        run: |
          set -euo pipefail
          fail=0
          for d in .agents/skills/*/; do
            f="${d}SKILL.md"
            [ -f "$f" ] || { echo "::error file=$d::missing SKILL.md"; fail=1; continue; }
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing opening '---' fence"; fail=1; continue; }
            fm="$(sed -n '2,/^---$/p' "$f")"
            for key in name description; do
              printf '%s\n' "$fm" | grep -qE "^${key}:" || { echo "::error file=$f::missing frontmatter key '${key}:'"; fail=1; }
            done
          done
          [ "$fail" -eq 0 ] && echo "OK: all .agents/skills/*/SKILL.md carry name/description"
      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            elon-ko ${{ github.ref_name }} — pure content library: 11 agent definitions
            (`.omp/agents/`) + 13 skills (`.agents/skills/`) for oh-my-pi. See README.md for
            copy-based consumption and migration from v2.x plugins.
